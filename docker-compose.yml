version: '3.8'

services:
  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 dataassist.wsgi:application
    volumes:
      - media_files:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=dataassist.settings_prod
      - SECRET_KEY=django-insecure-change-this-in-production
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1
    # Uncomment the line below if you create a .env file
    # env_file:
    #   - .env

volumes:
  media_files:
    
